[project]
name = "walkie-gateway"
version = "0.1.0"
description = "Mac gateway between the Walkie Talkie phone app and live Claude Code sessions"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Benny Johansson" }]
dependencies = [
    "av>=19,<20",
    "cryptography>=44,<50",
    "numpy>=2,<3",
    # Pinned: 2.0 needs a lexicon for this Kokoro model, and 1.13.8 is the version the voice was tested on.
    "sherpa-onnx==1.13.8",
    "sherpa-onnx-core==1.13.8",
]

[project.scripts]
walkie-gateway = "walkie_gateway.__main__:main"
walkie-front-desk = "walkie_gateway.front_desk:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["walkie_gateway"]
